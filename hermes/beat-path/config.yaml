# Beat Path on Runware. `npm run hermes:setup` installs this profile and fills in
# __NODE__ and __REPO__ with this machine's Node and repository paths.
# The key is read from RUNWARE_API_KEY in the environment, never stored here.
model:
  default: zai:glm@5.3
  provider: custom:runware
providers:
  runware:
    name: Runware
    api: https://api.runware.ai/v1
    key_env: RUNWARE_API_KEY
    transport: chat_completions
    default_model: zai:glm@5.3
    # Every live Runware text model with tool calling (catalog index, 14 Nov 2026), then the
    # newer ones documented only on their model pages (GLM-5.2/5.3, Kimi K3/K3.1 Pro, DeepSeek V4).
    # Switch with /model custom:runware:<AIR>; prices are in skills/runware-hermes.
    models:
      zai:glm@5.3: {}
      zai:glm@5.3-flash: {}
      zai:glm@5.2: {}
      moonshotai:kimi@k3.1-pro: {}
      moonshotai:kimi@k3: {}
      deepseek:v4@pro: {}
      deepseek:v4.1@flash: {}
      openai:gpt@5.4-mini: {}
      openai:gpt@5.4: {}
      openai:gpt@5.5: {}
      openai:gpt@5.4-pro: {}
      anthropic:claude@haiku-4.5: {}
      anthropic:claude@sonnet-4.6: {}
      anthropic:claude@opus-4.7: {}
      anthropic:claude@opus-4.8: {}
      anthropic:claude@fable-5: {}
      google:gemini@3.1-flash-lite: {}
      google:gemini@3-flash: {}
      google:gemini@3.5-flash: {}
      google:gemini@3.1-pro: {}
      zai:glm@5.1: {}
      xai:grok@4.3: {}
      minimax:m3@0: {}
mcp_servers:
  # Beat Path itself: shot scripts, describe, render (all local and free).
  motion-studio:
    command: __NODE__
    args:
      - __REPO__/mcp/bin/motion-studio-mcp.mjs
  # Runware's own MCP server: images, video, audio. Every write call asks first.
  runware:
    command: npx
    args: ["-y", "@runware/mcp@1.3.7"]
    env:
      RUNWARE_API_KEY: ${RUNWARE_API_KEY}
    trust: untrusted
    cost_unit: USD
    # A task's real price depends on the model: the agent reads model_pricing first.
    tool_costs:
      run: { credits: [0.005, 5], note: "per task, see model_pricing" }
    spend_limit: 10
platform_toolsets:
  cli:
    - file
    - terminal
    - skills
    - memory
    - todo
    - motion-studio
    - runware
terminal:
  cwd: __REPO__
