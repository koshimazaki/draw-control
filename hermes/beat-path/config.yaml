# Draw Control on Runware. `npm run hermes:setup` installs this profile and fills in the quoted
# Node and checkout placeholders below with this machine's paths.
# The key is never stored here. Both providers below name it as key_env: RUNWARE_API_KEY, which
# Hermes reads from the process environment or, for a turn the Hermes gateway runs, from this
# profile's own .env. On macOS, setup also adds a key_cmd line under each provider that reads the
# Keychain item runware-api-key, or prints RUNWARE_API_KEY when there is no such item. Hermes runs a
# key_cmd before key_env and never falls back to key_env, so setup writes it only on macOS, where
# /usr/bin/security exists. Keys per platform: docs/hermes.md.
# No spend limit covers the chat model itself (the two providers below): its tokens are billed by
# Runware with no cap in this file. The only spend guard is on the runware MCP server, further down.
model:
  default: openai:gpt@6.1-sol
  provider: custom:runware
# One Runware endpoint, two wire formats. Runware serves the OpenAI GPT models (and Qwen4-Max) on
# /v1/responses, and its other models on /v1/chat/completions only (runware.ai/docs/platform/openai,
# read 16 Nov 2026). GPT-6.1 Sol refuses function tools with reasoning on chat/completions, so the
# GPT family needs codex_responses (the Responses API); everything else stays on chat_completions.
# Every live Runware text model with tool calling (catalog index, 14 Nov 2026), then the newer
# "compatible-only" ones documented on their model pages; every ID checked against its public page on
# 15 Nov 2026. Switch with a short name below, or /model <AIR>; prices are in skills/runware-hermes.
providers:
  runware:
    name: Runware
    api: https://api.runware.ai/v1
    key_env: RUNWARE_API_KEY
    transport: codex_responses
    default_model: openai:gpt@6.1-sol
    models:
      openai:gpt@6.1-sol: {}
      openai:gpt@6-astra: {}
      openai:gpt@6-sol: {}
      openai:gpt@6.1-terra: {}
      openai:gpt@6-luna: {}
      openai:gpt@5.4-mini: {}
      openai:gpt@5.4: {}
      openai:gpt@5.5: {}
      # Qwen4-Max: live, function calling, on /v1/responses (runware.ai/qwen-4 and its model page,
      # 16 Nov 2026); one tool call through /v1/responses answered on 16 Nov 2026.
      alibaba:qwen@4-max: {}
  runware-chat:
    name: Runware (chat)
    api: https://api.runware.ai/v1
    key_env: RUNWARE_API_KEY
    transport: chat_completions
    default_model: zai:glm@5.3
    models:
      zai:glm@5.3: {}
      zai:glm@5.3-flash: {}
      zai:glm@5.2: {}
      moonshotai:kimi@k3.1-pro: {}
      moonshotai:kimi@k3: {}
      deepseek:v4@pro: {}
      deepseek:v4.1@flash: {}
      # Not on Runware's /v1/responses list, so it stays here; it may refuse tools with reasoning.
      openai:gpt@5.4-pro: {}
      anthropic:claude@haiku-4.5: {}
      anthropic:claude@sonnet-4.6: {}
      anthropic:claude@opus-4.7: {}
      anthropic:claude@opus-4.8: {}
      anthropic:claude@fable-5: {}
      google:gemini@3.1-flash-lite: {}
      google:gemini@3-flash: {}
      google:gemini@3.5-flash: {}
      google:gemini@3.1-pro: {}
      zai:glm@5.1: {}
      xai:grok@4.3: {}
      minimax:m3@0: {}
# Short names: `/model astra` in a chat, `/model astra --once` for one turn,
# `hermes -p beat-path -m astra` at launch. `npm run review -- --model astra` takes the same names.
# Each names its provider, so a switch keeps that provider's transport and key (an alias written as
# `provider: custom` with a base_url falls back to chat_completions, Hermes v0.23.1).
model_aliases:
  sol: { model: "openai:gpt@6.1-sol", provider: runware }
  astra: { model: "openai:gpt@6-astra", provider: runware }
  terra: { model: "openai:gpt@6.1-terra", provider: runware }
  luna: { model: "openai:gpt@6-luna", provider: runware }
  mini: { model: "openai:gpt@5.4-mini", provider: runware }
  qwen: { model: "alibaba:qwen@4-max", provider: runware }
  glm: { model: "zai:glm@5.3", provider: runware-chat }
  kimi: { model: "moonshotai:kimi@k3.1-pro", provider: runware-chat }
  deepseek: { model: "deepseek:v4@pro", provider: runware-chat }
  opus: { model: "anthropic:claude@opus-4.8", provider: runware-chat }
  gemini: { model: "google:gemini@3.1-pro", provider: runware-chat }
  grok: { model: "xai:grok@4.3", provider: runware-chat }
mcp_servers:
  # Draw Control itself: shot scripts, describe, render (all local and free).
  motion-studio:
    command: "__NODE__"
    args:
      - "__REPO__/mcp/bin/motion-studio-mcp.mjs"
  # Runware's own MCP server: images, video, audio.
  runware:
    command: npx
    args: ["-y", "@runware/mcp@1.3.7"]
    env:
      RUNWARE_API_KEY: ${RUNWARE_API_KEY}
    # trust: untrusted makes every call to a tool not annotated read-only ask for approval, until
    # the owner answers "for this session" or "always" for that tool; from then on it runs unasked.
    trust: untrusted
    cost_unit: USD
    # What Hermes does with these (tools/mcp_tool_costs.py): it books the top of the declared range,
    # 5 USD, for every `run` it dispatches, in memory for this chat only, and never sees Runware's
    # real bill. A call that would take the chat's booked total past spend_limit asks for an explicit
    # yes for that one call, even after an "always" grant; it does not block. Here that is the third
    # `run` of a chat (5 + 5 = 10 is still within the limit). The tally starts again at 0 in a new
    # chat or a restarted Hermes. It covers this server only, never the chat model's own tokens.
    tool_costs:
      run: { credits: [0.005, 5], note: "per task, see model_pricing" }
    spend_limit: 10
platform_toolsets:
  cli:
    - file
    - terminal
    - skills
    - memory
    - todo
    - motion-studio
    - runware
terminal:
  cwd: "__REPO__"
